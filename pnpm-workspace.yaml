# The dev stack starts this app headless (process-compose, no TTY). pnpm 11
# runs an install before `next dev` when node_modules is out of date, and
# that install may need to purge node_modules (store moved, layout changed).
# Without a TTY the purge confirmation aborts and the process dies, so skip
# the prompt; node_modules is always regenerable from the lockfile.
confirmModulesPurge: false

allowBuilds:
  '@bufbuild/buf': true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true

# Every override below is kept only because its parent still pins a vulnerable
# version in its own manifest (checked by regenerating the lockfile without
# overrides: the parent resolved the vulnerable version again). When a parent
# bumps, drop the override; `pnpm why <pkg>` names the parent.
overrides:
  # @vercel/container pins tar 7.5.11 (critical GHSA-ids in 7.5.11 up to 7.5.20).
  tar: '^7.5.21'
  # @vercel/python-analysis pins js-yaml 4.1.1; orval resolves 4.3.1.
  js-yaml: '^4.3.2'
  # @vercel/python-analysis pins minimatch 10.1.1.
  '@vercel/python-analysis>minimatch': '^10.2.3'
  # @vercel/container pins smol-toml 1.5.2.
  smol-toml: '^1.8.1'
  # eslint-plugin-boundaries (via @boundaries/elements) resolves handlebars 4.7.9.
  handlebars: '^4.7.10'
  # @vercel/backends (via @vercel/static-config) pins ajv 8.6.3.
  '@vercel/static-config>ajv': '^8.18.0'
  # @vercel/node and @vercel/remix-builder pin path-to-regexp 6.1.0; @vercel/backends,
  # @vercel/express and @vercel/hono pin 8.3.0. Version selectors cover every
  # vercel sub-package that resolves a vulnerable range.
  'path-to-regexp@<6.3.0': '^6.3.0'
  'path-to-regexp@>=8.0.0 <8.4.0': '^8.4.0'
  # vercel, @vercel/node and @vercel/blob pin undici 5.x / 6.29.0. Chain-scoped
  # on purpose: the major jump is only safe for these dev-tool parents.
  'vercel>undici': '^6.29.1'
  '@vercel/node>undici': '^6.29.1'
  '@vercel/blob>undici': '^6.29.1'
  # jsdom (test environment) resolves undici 7.30.0.
  'jsdom>undici': '^7.30.1'
  # eslint-plugin-react-hooks, @vercel/cli-config and @vercel/cli-auth resolve zod below 4.6.6.
  'eslint-plugin-react-hooks>zod': '^4.6.6'
  '@vercel/cli-config>zod': '^4.6.6'
  '@vercel/cli-auth>zod': '^4.6.6'
