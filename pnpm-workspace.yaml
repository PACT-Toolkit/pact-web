# The dev stack starts this app headless (process-compose, no TTY). pnpm 11
# runs an install before `next dev` when node_modules is out of date, and
# that install may need to purge node_modules (store moved, layout changed).
# Without a TTY the purge confirmation aborts and the process dies, so skip
# the prompt; node_modules is always regenerable from the lockfile.
confirmModulesPurge: false

allowBuilds:
  '@bufbuild/buf': true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true

# Every override below is kept only because its parent still pins a vulnerable
# version in its own manifest (checked by regenerating the lockfile without
# overrides: the parent resolved the vulnerable version again). When a parent
# bumps, drop the override; `pnpm why <pkg>` names the parent. Overrides whose
# parents have bumped on their own were removed.
overrides:
  # @vercel/fun pins tar 7.5.7: GHSA-23hp-3jrh-7fpw, GHSA-r292-9mhp-454m and
  # others. 7.5.21 is the first release that clears all of them.
  tar: '^7.5.21'
  # @vercel/fun pins @tootallnate/once 2.0.0: GHSA-vpq2-c234-7xj6.
  '@tootallnate/once': '^2.0.1'
  # @vercel/node pins undici 5.28.4 (many advisories, e.g. GHSA-vrm6-8vpv-qv8q).
  # Chain-scoped on purpose: the major jump is only safe for this one parent.
  '@vercel/node>undici': '^6.28.1'
  # @vercel/python-analysis pins js-yaml 4.1.1 (GHSA-52cp-r559-cp3m,
  # GHSA-2883-xcg3-v3hh); orval resolves 4.3.1 without the floor.
  js-yaml: '^4.3.0'
  # @vercel/python-analysis pins minimatch 10.1.1 (GHSA-3ppc-4f35-3m26,
  # GHSA-7r86-cg39-jmmj, GHSA-23c5-xmqv-rm74).
  '@vercel/python-analysis>minimatch': '^10.2.3'
  # @vercel/backends pins srvx 0.8.9: GHSA-p36q-q72m-gchr.
  '@vercel/backends>srvx': '^0.11.13'
  # eslint-plugin-boundaries (via @boundaries/elements) resolves handlebars
  # 4.7.9: GHSA-8r5x-fm3f-whwj, GHSA-p8wg-vrv2-v86f, GHSA-xw65-4hp5-5hc7.
  handlebars: '^4.7.10'
  # @vercel/python-analysis, @vercel/rust and vercel pin smol-toml 1.5.2:
  # GHSA-7w5x-hrqm-74c2, GHSA-v3rj-xjv7-4jmq, GHSA-r4xh-jqrq-34v2.
  smol-toml: '1.9.0'
