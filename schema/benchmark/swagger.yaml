basePath: /
definitions:
    benchmark.AdaptiveCampaignAttemptBody:
        properties:
            attempt:
                type: integer
            blocking_stage:
                description: |-
                    BlockingStage names the stage whose verdict blocked the candidate;
                    empty when none did.
                type: string
            candidate:
                type: string
            classifier_label:
                type: string
            classifier_score:
                description: |-
                    ClassifierScore is omitted when the classifier did not answer, so a
                    score of 0 stays distinct from no score.
                type: number
            decision:
                type: string
            error:
                description: Error is non-empty when the check request failed.
                type: string
            filter_verdict:
                type: string
            latency_ms:
                type: number
            redactor_verdict:
                type: string
            rejection_reason:
                description: |-
                    RejectionReason is "refusal", "empty" or "identical" on a
                    "rewrite_rejected" row and the last attacker LLM error on a
                    "provider_error" row; empty otherwise.
                type: string
            timestamp:
                description: Timestamp is Unix seconds (UTC).
                type: integer
        required:
            - attempt
            - blocking_stage
            - candidate
            - classifier_label
            - decision
            - error
            - filter_verdict
            - latency_ms
            - redactor_verdict
            - rejection_reason
            - timestamp
        type: object
    benchmark.AdaptiveCampaignBody:
        properties:
            attacker_model:
                type: string
            budget:
                type: integer
            corpus_name:
                type: string
            error:
                description: Error is the failure reason; empty unless status is "aborted" or "error".
                type: string
            finished_at:
                type: integer
            goal_limit:
                type: integer
            goals:
                description: Goals has one summary per finished goal; always empty on the list route.
                items:
                    $ref: '#/definitions/benchmark.AdaptiveCampaignGoalSummaryBody'
                type: array
            goals_done:
                type: integer
            goals_total:
                type: integer
            id:
                type: string
            result:
                allOf:
                    - $ref: '#/definitions/benchmark.AdaptiveCampaignResultBody'
                description: Result is absent while no goal has finished.
            started_at:
                type: integer
            status:
                type: string
        required:
            - attacker_model
            - budget
            - corpus_name
            - error
            - finished_at
            - goal_limit
            - goals
            - goals_done
            - goals_total
            - id
            - started_at
            - status
        type: object
    benchmark.AdaptiveCampaignGoalBody:
        properties:
            attempts:
                items:
                    $ref: '#/definitions/benchmark.AdaptiveCampaignAttemptBody'
                type: array
            category:
                type: string
            error:
                type: string
            final_candidate:
                description: |-
                    FinalCandidate is the last candidate text the goal ended on: the
                    gateway-allowed text for a successful goal.
                type: string
            goal_id:
                type: string
            outcome:
                type: string
            queries_used:
                type: integer
            success:
                type: boolean
        required:
            - attempts
            - category
            - error
            - final_candidate
            - goal_id
            - outcome
            - queries_used
            - success
        type: object
    benchmark.AdaptiveCampaignGoalSummaryBody:
        properties:
            category:
                type: string
            error:
                description: Error is set only for a "provider_error" goal.
                type: string
            goal_id:
                type: string
            outcome:
                type: string
            queries_used:
                type: integer
            success:
                type: boolean
        required:
            - category
            - error
            - goal_id
            - outcome
            - queries_used
            - success
        type: object
    benchmark.AdaptiveCampaignResultBody:
        properties:
            asr:
                description: ASR is goals_succeeded over all goals, with its Wilson 95% interval.
                type: number
            asr_attackable:
                description: |-
                    ASRAttackable is successes over attackable_goals, with its Wilson 95%
                    interval.
                type: number
            asr_attackable_ci_lower:
                type: number
            asr_attackable_ci_upper:
                type: number
            asr_ci_lower:
                type: number
            asr_ci_upper:
                type: number
            attackable_goals:
                description: |-
                    AttackableGoals is the number of goals whose outcome is not
                    attacker_refused, attacker_stalled, input_rejected, provider_error or
                    gateway_error.
                type: integer
            attacker_refused:
                type: integer
            attacker_stalled:
                type: integer
            budget:
                type: integer
            budget_exhausted_blocked:
                type: integer
            gateway_error:
                type: integer
            goals_succeeded:
                type: integer
            goals_total:
                type: integer
            input_rejected:
                type: integer
            model:
                type: string
            provider:
                type: string
            provider_error:
                type: integer
            queries_to_success:
                description: QueriesToSuccess lists the queries used by each succeeded goal.
                items:
                    type: integer
                type: array
            seed:
                type: integer
            seed_allowed:
                description: The goal counts per outcome.
                type: integer
            succeeded_after_rewrite:
                type: integer
            temperature:
                type: number
            timestamp:
                description: Timestamp is Unix seconds (UTC).
                type: integer
        required:
            - asr
            - asr_attackable
            - asr_attackable_ci_lower
            - asr_attackable_ci_upper
            - asr_ci_lower
            - asr_ci_upper
            - attackable_goals
            - attacker_refused
            - attacker_stalled
            - budget
            - budget_exhausted_blocked
            - gateway_error
            - goals_succeeded
            - goals_total
            - input_rejected
            - model
            - provider
            - provider_error
            - queries_to_success
            - seed
            - seed_allowed
            - succeeded_after_rewrite
            - temperature
            - timestamp
        type: object
    benchmark.BenchmarkHubImportSummary:
        properties:
            attack_rows:
                description: |-
                    AttackRows is the number of rows with expected label "block", after
                    screening.
                type: integer
            benign_rows:
                description: |-
                    BenignRows is the number of rows with expected label "allow", after
                    screening.
                type: integer
            config:
                description: |-
                    Config is the dataset config name that was imported; empty when the
                    dataset has no configs.
                type: string
            rows_excluded_trained_on:
                description: |-
                    RowsExcludedTrainedOn is the number of rows dropped because their
                    fingerprint is in the trained-on manifest.
                type: integer
            rows_read:
                description: RowsRead is the number of hub records consumed.
                type: integer
            rows_skipped:
                description: |-
                    RowsSkipped is the number of rows dropped for blank content or a label
                    mapped to "skip".
                type: integer
            screened:
                description: Screened is true when a trained-on manifest was configured and applied.
                type: boolean
            slug:
                description: Slug is the imported dataset's "owner/name", as resolved by the import.
                type: string
            split:
                description: Split is the hub split that was imported.
                type: string
            truncated:
                description: Truncated is true when the server ceiling cut the read short.
                type: boolean
        required:
            - attack_rows
            - benign_rows
            - config
            - rows_excluded_trained_on
            - rows_read
            - rows_skipped
            - screened
            - slug
            - split
            - truncated
        type: object
    benchmark.BenchmarkImportPreviewResponse:
        properties:
            columns:
                description: Columns is the split's column names, in hub order; never nil.
                items:
                    type: string
                type: array
            detected_label_column:
                description: |-
                    DetectedLabelColumn is the column LabelValues describes: the request's
                    label_column when set, otherwise the alias guess; empty when none.
                type: string
            detected_text_column:
                description: |-
                    DetectedTextColumn is the alias-detected text column; empty when none
                    matched.
                type: string
            label_values:
                description: |-
                    LabelValues holds the distinct raw values seen in the sample for
                    DetectedLabelColumn, trimmed and lowercased (the key form
                    BenchmarkImportRequest.LabelValues accepts), in first-seen order, at
                    most 20 entries; never nil.
                items:
                    type: string
                type: array
            label_values_truncated:
                description: |-
                    LabelValuesTruncated is true when more than 20 distinct values were
                    seen in the sample.
                type: boolean
            row_count:
                description: RowCount is the split size from hub metadata; 0 when unknown.
                type: integer
            sampled_rows:
                description: SampledRows is the number of records actually peeked.
                type: integer
            score_column:
                description: |-
                    ScoreColumn is the numeric score column the preview resolved (the
                    requested one, or alias-detected when no label column resolves); empty
                    when the dataset has none. The three fields below are 0 in that case.
                type: string
            score_sample_allow_rows:
                description: |-
                    ScoreSampleAllowRows is the number of sampled rows below the effective
                    threshold, which the import labels "allow".
                type: integer
            score_sample_block_rows:
                description: |-
                    ScoreSampleBlockRows is the number of sampled rows at or above the
                    effective threshold, which the import labels "block".
                type: integer
            suggested_assume_label:
                description: |-
                    SuggestedAssumeLabel is "allow" or "block" when the dataset has no
                    label column and its name implies one, otherwise empty; the client
                    should pre-select it as the assume-label.
                type: string
            suggested_label_values:
                additionalProperties:
                    type: string
                description: |-
                    SuggestedLabelValues holds one entry per LabelValues item, mapping it
                    to "allow", "block", or "skip"; never nil ({} when there is no label
                    column).
                type: object
            suggested_threshold:
                description: |-
                    SuggestedThreshold is 0.5 when every sampled score is in [0, 1],
                    otherwise the midpoint of the observed minimum and maximum. Meaningful
                    only when ScoreColumn is non-empty.
                type: number
        required:
            - columns
            - detected_label_column
            - detected_text_column
            - label_values
            - label_values_truncated
            - row_count
            - sampled_rows
            - score_column
            - score_sample_allow_rows
            - score_sample_block_rows
            - suggested_assume_label
            - suggested_label_values
            - suggested_threshold
        type: object
    benchmark.BenchmarkImportRequest:
        properties:
            assume_label:
                description: |-
                    AssumeLabel is "allow" or "block" for a dataset with no label column;
                    empty means read the label from LabelColumn/LabelValues.
                type: string
            config:
                type: string
            engine:
                type: string
            gateway_url:
                description: |-
                    GatewayURL is deprecated and ignored: the gateway always uses its own
                    configured URL (PACT_BENCHMARK_GATEWAY_URL). Accepted so existing
                    clients that still send it keep working.

                    Deprecated: omit this field.
                type: string
            label_column:
                type: string
            label_values:
                additionalProperties:
                    type: string
                description: |-
                    LabelValues maps a raw value (trimmed, lowercased) to "allow", "block",
                    or "skip". Checked before the built-in vocabulary.
                type: object
            max_rows:
                description: |-
                    MaxRows is the number of hub records read; 0 -> the server ceiling.
                    Values above the ceiling are clamped, not rejected.
                type: integer
            revision:
                description: Revision is the hub git revision; empty -> the default branch.
                type: string
            score_column:
                description: |-
                    ScoreColumn names the numeric score column; empty -> detection as in
                    the preview.
                type: string
            score_threshold:
                description: |-
                    ScoreThreshold is the block threshold for ScoreColumn; nil -> the
                    suggested threshold.
                type: number
            slug:
                type: string
            split:
                type: string
            text_column:
                type: string
        required:
            - slug
        type: object
    benchmark.BenchmarkRunBody:
        properties:
            corpus_version:
                type: string
            counts:
                allOf:
                    - $ref: '#/definitions/benchmark.RunCountsBody'
                description: |-
                    Counts is absent when the producer did not record it (runs persisted
                    before the breakdown existed); never zero-filled.
            degraded:
                description: |-
                    Degraded is true when (errors + unscored + throttled) / row_count
                    exceeds the run's degradation threshold, so the headline rates are
                    unreliable. False on a run stored before the field.
                type: boolean
            detection_rate:
                type: number
            engine:
                type: string
            fp_rate:
                type: number
            gateway_version:
                type: string
            id:
                type: string
            p50_latency:
                type: number
            p99_latency:
                type: number
            per_category:
                description: |-
                    PerCategory is absent when the producer did not record it (runs
                    persisted before the breakdown existed); never zero-filled.
                items:
                    $ref: '#/definitions/benchmark.CategoryBreakdownBody'
                type: array
            per_layer:
                description: |-
                    PerLayer is absent when the producer did not record it (runs
                    persisted before the breakdown existed); never zero-filled.
                items:
                    $ref: '#/definitions/benchmark.LayerBreakdownBody'
                type: array
            ran_at:
                type: integer
            row_count:
                type: integer
            timing_completeness:
                allOf:
                    - $ref: '#/definitions/benchmark.TimingCompletenessBody'
                description: |-
                    TimingCompleteness is absent when the producer did not record it (runs
                    persisted before the summary existed); never zero-filled.
        required:
            - corpus_version
            - degraded
            - detection_rate
            - engine
            - fp_rate
            - gateway_version
            - id
            - p50_latency
            - p99_latency
            - ran_at
            - row_count
        type: object
    benchmark.BenchmarkRunRowBody:
        properties:
            attempts:
                type: integer
            category:
                type: string
            classifier_label:
                type: string
            classifier_score:
                type: number
            decision:
                type: string
            decisive_layer:
                type: string
            error:
                type: string
            expected_label:
                type: string
            filter_rule_id:
                type: string
            fingerprint:
                type: string
            latency_ms:
                type: number
            reason:
                type: string
            redacted:
                type: boolean
            row_id:
                type: string
            seq:
                type: integer
            throttled:
                type: boolean
            unscored:
                type: boolean
        required:
            - decision
            - expected_label
            - latency_ms
            - row_id
        type: object
    benchmark.CategoryBreakdownBody:
        properties:
            attacks:
                description: |-
                    Attacks is the number of attack rows scored in this category: every
                    attack row except throttled ones.
                type: integer
            benign:
                description: |-
                    Benign is the number of benign rows scored in this category: every
                    benign row except throttled ones.
                type: integer
            category:
                type: string
            detected:
                description: Detected is the number of attack rows blocked.
                type: integer
            entries:
                type: integer
            errors:
                description: |-
                    Errors is the number of non-throttled rows whose request failed. Inside
                    attacks/benign, scored as allowed.
                type: integer
            fp:
                description: FP is the number of benign rows blocked (false positives).
                type: integer
            mitigated:
                description: |-
                    Mitigated is the number of attack rows in this category the gateway
                    allowed after masking content. Inside attacks, outside detected.
                type: integer
            throttled:
                description: |-
                    Throttled is the number of rows in this category that exhausted the
                    runner's retry budget against HTTP 429 (rate limited). Excluded
                    from attacks/benign and from errors.
                type: integer
            unscored:
                description: |-
                    Unscored is the number of rows in this category the gateway answered
                    with a fail-open allow because the classifier produced no verdict.
                    Inside attacks/benign, scored as allowed.
                type: integer
        required:
            - attacks
            - benign
            - category
            - detected
            - entries
            - errors
            - fp
            - mitigated
            - throttled
            - unscored
        type: object
    benchmark.CorpusDatasetSummaryBody:
        properties:
            allow_rows:
                type: integer
            block_rows:
                type: integer
            category:
                type: string
            license:
                type: string
            role:
                description: |-
                    Role is the dataset's train/eval role: "training" or "evaluation" in
                    the common case. An empty string means the row predates the role
                    column and has not yet been backfilled by pact-benchmark --
                    treat it as unknown, not as an invalid value. No `enums` annotation
                    here deliberately: swag's enum constraint has no way to express
                    "one of these two, or empty during backfill", and a false enum
                    constraint would mislead OpenAPI consumers (e.g. orval) into
                    generating a strict union type that rejects a legal wire value.
                type: string
            source_dataset:
                type: string
            total_rows:
                type: integer
        required:
            - allow_rows
            - block_rows
            - category
            - license
            - source_dataset
            - total_rows
        type: object
    benchmark.CorpusLibrarySummaryResponse:
        properties:
            datasets:
                items:
                    $ref: '#/definitions/benchmark.CorpusDatasetSummaryBody'
                type: array
            total_rows:
                type: integer
        required:
            - datasets
            - total_rows
        type: object
    benchmark.GetJobResponse:
        properties:
            error:
                type: string
            hub_import:
                allOf:
                    - $ref: '#/definitions/benchmark.BenchmarkHubImportSummary'
                description: |-
                    HubImport is set only when this job was started by POST
                    /v1/benchmark/imports rather than a corpus bulk-test
                    submission; nil for any other job.
            progress_pct:
                type: integer
            result:
                $ref: '#/definitions/benchmark.JobResultBody'
            status:
                type: string
        required:
            - progress_pct
            - status
        type: object
    benchmark.JobResultBody:
        properties:
            counts:
                allOf:
                    - $ref: '#/definitions/benchmark.RunCountsBody'
                description: |-
                    Counts is absent when the producer did not record it (runs persisted
                    before the breakdown existed); never zero-filled.
            degraded:
                description: |-
                    Degraded is true when (errors + unscored + throttled) / total_rows
                    exceeds the run's degradation threshold, so the headline rates are
                    unreliable. False on a run stored before the field.
                type: boolean
            detection_rate:
                type: number
            fp_rate:
                type: number
            p50_latency_ms:
                type: number
            p99_latency_ms:
                type: number
            per_category:
                description: |-
                    PerCategory is absent when the producer did not record it (runs
                    persisted before the breakdown existed); never zero-filled.
                items:
                    $ref: '#/definitions/benchmark.CategoryBreakdownBody'
                type: array
            per_layer:
                description: |-
                    PerLayer is absent when the producer did not record it (runs
                    persisted before the breakdown existed); never zero-filled.
                items:
                    $ref: '#/definitions/benchmark.LayerBreakdownBody'
                type: array
            rows:
                items:
                    $ref: '#/definitions/benchmark.JobRowBody'
                type: array
            run_id:
                description: |-
                    RunID names the persisted benchmark run this job produced, usable with
                    GET /v1/benchmark/runs/{id}/rows. Absent until the run is persisted and
                    stays absent when persistence is disabled or failed.
                type: string
            timing_completeness:
                allOf:
                    - $ref: '#/definitions/benchmark.TimingCompletenessBody'
                description: |-
                    TimingCompleteness is absent when the producer did not record it (runs
                    persisted before the summary existed); never zero-filled.
            total_rows:
                type: integer
        required:
            - degraded
            - detection_rate
            - fp_rate
            - p50_latency_ms
            - p99_latency_ms
            - rows
            - total_rows
        type: object
    benchmark.JobRowBody:
        properties:
            attempts:
                type: integer
            decision:
                type: string
            error:
                type: string
            expected_label:
                type: string
            latency_ms:
                type: number
            row_id:
                type: string
            unscored:
                type: boolean
        required:
            - decision
            - expected_label
            - latency_ms
            - row_id
        type: object
    benchmark.LayerBreakdownBody:
        properties:
            layer:
                type: string
            p50_ms:
                type: number
            p99_ms:
                type: number
            samples:
                type: integer
        required:
            - layer
            - p50_ms
            - p99_ms
            - samples
        type: object
    benchmark.LayerTimingCompletenessBody:
        properties:
            layer:
                description: |-
                    Layer is the response object name: filter, classifier, consensus,
                    redactor, policy, external_refs.
                type: string
            rows_missing_duration:
                description: |-
                    RowsMissingDuration is the number of those rows whose object had no
                    duration_ms. Never above rows_with_signal.
                type: integer
            rows_with_signal:
                description: |-
                    RowsWithSignal is the number of rows whose response carried this layer's
                    object.
                type: integer
        required:
            - layer
            - rows_missing_duration
            - rows_with_signal
        type: object
    benchmark.ListAdaptiveCampaignsResponse:
        properties:
            campaigns:
                items:
                    $ref: '#/definitions/benchmark.AdaptiveCampaignBody'
                type: array
        required:
            - campaigns
        type: object
    benchmark.ListRunRowsResponse:
        properties:
            rows:
                items:
                    $ref: '#/definitions/benchmark.BenchmarkRunRowBody'
                type: array
            total:
                type: integer
        required:
            - rows
            - total
        type: object
    benchmark.ListRunsResponse:
        properties:
            runs:
                items:
                    $ref: '#/definitions/benchmark.BenchmarkRunBody'
                type: array
            total:
                type: integer
        required:
            - runs
            - total
        type: object
    benchmark.ListTestLabRunsResponse:
        properties:
            runs:
                items:
                    $ref: '#/definitions/benchmark.TestLabRunBody'
                type: array
            total:
                type: integer
        required:
            - runs
            - total
        type: object
    benchmark.RunCountsBody:
        properties:
            attacks:
                description: |-
                    Attacks is the number of attack rows scored: every attack row except
                    throttled ones. Errored and unscored attack rows count as allowed, so
                    they are misses.
                type: integer
            benign:
                description: |-
                    Benign is the number of benign rows scored: every benign row except
                    throttled ones. Errored and unscored benign rows count as allowed.
                type: integer
            errors:
                description: |-
                    Errors is the number of non-throttled rows whose request failed. Inside
                    attacks/benign: nothing blocked the prompt, so the row counts as
                    allowed.
                type: integer
            false_positives:
                description: FalsePositives is the number of benign rows blocked.
                type: integer
            mitigated:
                description: |-
                    Mitigated is the number of attack rows the gateway allowed after
                    masking content (redacted, or reason classifier_mitigated). Inside
                    attacks, outside true_positives: neither a detection nor a miss. Zero
                    on a run that predates this field means "not recorded".
                type: integer
            requeues:
                description: |-
                    Requeues is the number of extra attempts the runner spent requeueing
                    rows after a 429, 5xx or transport error. Zero on a run stored before
                    the field.
                type: integer
            throttled:
                description: |-
                    Throttled is the number of rows that exhausted the runner's retry
                    budget against HTTP 429 (rate limited). Excluded from
                    attacks/benign and from errors: a shed request is the gateway's
                    rate limiter working, not a pipeline failure.
                type: integer
            true_positives:
                description: TruePositives is the number of attack rows blocked.
                type: integer
            unscored:
                description: |-
                    Unscored is the number of rows the gateway answered with a fail-open
                    allow because the classifier produced no verdict. Inside
                    attacks/benign: the prompt was allowed, so an unscored attack row is a
                    miss. Disjoint from errors and throttled.
                type: integer
        required:
            - attacks
            - benign
            - errors
            - false_positives
            - mitigated
            - requeues
            - throttled
            - true_positives
            - unscored
        type: object
    benchmark.SaveCorpusRequest:
        properties:
            attack_type:
                type: string
            category:
                type: string
            content:
                type: string
            expected_label:
                type: string
            filter_rule_id:
                type: string
            kind:
                type: string
            reason:
                type: string
        required:
            - content
        type: object
    benchmark.SaveCorpusResponse:
        properties:
            id:
                type: string
            status:
                type: string
        required:
            - id
            - status
        type: object
    benchmark.SaveTestLabRunRequest:
        properties:
            attack_type:
                type: string
            content:
                type: string
            decision:
                type: string
            error:
                description: Error is the short failure summary; only meaningful when Status is "error".
                type: string
            filter_rule_id:
                type: string
            latency_ms:
                type: integer
            reason:
                type: string
            request_id:
                type: string
            status:
                description: Status is "ok" or "error"; empty defaults to "ok".
                type: string
        required:
            - content
        type: object
    benchmark.SaveTestLabRunResponse:
        properties:
            id:
                type: string
        required:
            - id
        type: object
    benchmark.StartAdaptiveCampaignRequest:
        properties:
            attacker_model:
                description: |-
                    AttackerModel names the attacker LLM. Omitted = the deployment-configured
                    model.
                maxLength: 128
                type: string
            budget:
                description: |-
                    Budget is the number of attempts per goal. 0 or omitted = the server
                    default.
                maximum: 2147483647
                minimum: 0
                type: integer
            corpus_name:
                description: |-
                    CorpusName is the file name of a bundled campaign corpus; pact-benchmark
                    validates it against its campaign directory.
                maxLength: 255
                minLength: 1
                type: string
            goal_limit:
                description: |-
                    GoalLimit runs only the first N goals of the corpus. 0 or omitted = all
                    goals.
                maximum: 2147483647
                minimum: 0
                type: integer
        required:
            - corpus_name
        type: object
    benchmark.StartAdaptiveCampaignResponse:
        properties:
            campaign_id:
                type: string
        required:
            - campaign_id
        type: object
    benchmark.SubmitJobRequest:
        properties:
            corpus_jsonl:
                type: string
            engine:
                type: string
            gateway_url:
                description: |-
                    GatewayURL is deprecated and ignored: the gateway always uses its own
                    configured URL (PACT_BENCHMARK_GATEWAY_URL). Accepted so existing
                    clients that still send it keep working.

                    Deprecated: omit this field.
                type: string
        required:
            - corpus_jsonl
        type: object
    benchmark.SubmitJobResponse:
        properties:
            job_id:
                type: string
        required:
            - job_id
        type: object
    benchmark.TestLabRunBody:
        properties:
            attack_type:
                type: string
            content:
                type: string
            created_at:
                type: integer
            decision:
                type: string
            error:
                description: Error is the short failure summary when Status is "error"; empty otherwise.
                type: string
            filter_rule_id:
                type: string
            id:
                type: string
            latency_ms:
                type: integer
            reason:
                type: string
            request_id:
                type: string
            status:
                description: |-
                    Status is "ok" or "error"; empty means "ok" for rows written before
                    failed-run support existed.
                type: string
        required:
            - attack_type
            - content
            - created_at
            - id
            - latency_ms
        type: object
    benchmark.TimingCompletenessBody:
        properties:
            layers:
                description: |-
                    Layers has one entry per layer in a fixed order, including layers no row
                    reported (rows_with_signal 0).
                items:
                    $ref: '#/definitions/benchmark.LayerTimingCompletenessBody'
                type: array
            rows_missing_stages:
                description: |-
                    RowsMissingStages is the number of those rows whose response carried no
                    stages list or an empty one.
                type: integer
            rows_total:
                description: RowsTotal is the number of rows that got a gateway response.
                type: integer
        required:
            - layers
            - rows_missing_stages
            - rows_total
        type: object
    boundary.ErrorResponse:
        properties:
            code:
                type: string
            error:
                type: string
        type: object
host: localhost:8110
info:
    contact: {}
    description: Public REST entrypoint for the PACT safety pipeline.
    title: pact-gateway
    version: 0.1.0
paths:
    /v1/benchmark/adaptive-attack/campaigns:
        get:
            description: Returns campaigns newest first, without per-goal summaries.
            operationId: listAdaptiveCampaigns
            parameters:
                - description: Max campaigns to return (0 or omitted = the server default)
                  in: query
                  name: limit
                  type: integer
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/benchmark.ListAdaptiveCampaignsResponse'
                "400":
                    description: invalid query parameter
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
                "502":
                    description: upstream error
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
            security:
                - Bearer: []
            summary: List adaptive attack campaigns
            tags:
                - benchmark
        post:
            consumes:
                - application/json
            description: |-
                Starts the adaptive attacker loop (acceptance test FAT-11)
                over a bundled campaign corpus as a server-side job and
                returns its id immediately; poll it with
                GET /v1/benchmark/adaptive-attack/campaigns/{id}. Only one
                campaign runs at a time per deployment (409 while one runs).
            operationId: startAdaptiveCampaign
            parameters:
                - description: Bundled corpus and run limits
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/benchmark.StartAdaptiveCampaignRequest'
            produces:
                - application/json
            responses:
                "202":
                    description: Accepted
                    schema:
                        $ref: '#/definitions/benchmark.StartAdaptiveCampaignResponse'
                "400":
                    description: invalid request body or no attacker configured
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
                "409":
                    description: a campaign is already running
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
                "502":
                    description: upstream error
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
            security:
                - Bearer: []
            summary: Start an adaptive attack campaign
            tags:
                - benchmark
    /v1/benchmark/adaptive-attack/campaigns/{id}:
        get:
            description: |-
                Returns one campaign with a summary per finished goal but no
                attempt transcripts; fetch a transcript with
                GET /v1/benchmark/adaptive-attack/campaigns/{id}/goals/{goal_id}.
            operationId: getAdaptiveCampaign
            parameters:
                - description: Campaign ID (StartAdaptiveCampaignResponse.campaign_id)
                  in: path
                  name: id
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/benchmark.AdaptiveCampaignBody'
                "400":
                    description: invalid request
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
                "404":
                    description: campaign not found
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
                "502":
                    description: upstream error
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
            security:
                - Bearer: []
            summary: Poll an adaptive attack campaign
            tags:
                - benchmark
    /v1/benchmark/adaptive-attack/campaigns/{id}/goals/{goal_id}:
        get:
            operationId: getAdaptiveCampaignGoal
            parameters:
                - description: Campaign ID
                  in: path
                  name: id
                  required: true
                  type: string
                - description: Goal ID (AdaptiveCampaignGoalSummaryBody.goal_id)
                  in: path
                  name: goal_id
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/benchmark.AdaptiveCampaignGoalBody'
                "400":
                    description: invalid request
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
                "404":
                    description: campaign or goal not found
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
                "502":
                    description: upstream error
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
            security:
                - Bearer: []
            summary: Get one adaptive attack goal with its attempt transcript
            tags:
                - benchmark
    /v1/benchmark/corpus:
        post:
            consumes:
                - application/json
            operationId: saveBenchmarkCorpusEntry
            parameters:
                - description: Corpus entry (content plus optional classification fields)
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/benchmark.SaveCorpusRequest'
            produces:
                - application/json
            responses:
                "201":
                    description: Created
                    schema:
                        $ref: '#/definitions/benchmark.SaveCorpusResponse'
                "400":
                    description: invalid request body
                    schema:
                        type: string
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
                "502":
                    description: upstream error
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
            security:
                - Bearer: []
            summary: Save one Test Lab corpus entry
            tags:
                - benchmark
    /v1/benchmark/corpus/library:
        get:
            description: |-
                Aggregate stats grouped by source dataset, served from
                pact-benchmark's corpus_library table. An empty library is
                a valid response with total_rows 0.
            operationId: getBenchmarkCorpusLibrarySummary
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/benchmark.CorpusLibrarySummaryResponse'
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
                "502":
                    description: upstream error
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
            security:
                - Bearer: []
            summary: Get corpus library summary
            tags:
                - benchmark
    /v1/benchmark/imports:
        post:
            consumes:
                - application/json
            description: |-
                Starts an asynchronous import: pact-benchmark
                streams the split, normalises it through the shared corpus
                mapping, screens it against the trained-on manifest when one
                is configured, and runs it as a benchmark job. The resulting
                job is polled the same way as a corpus bulk-test job
                (GET /v1/benchmark/jobs/{id}).
            operationId: importBenchmarkDataset
            parameters:
                - description: Hugging Face dataset and column mapping
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/benchmark.BenchmarkImportRequest'
            produces:
                - application/json
            responses:
                "202":
                    description: Accepted
                    schema:
                        $ref: '#/definitions/benchmark.SubmitJobResponse'
                "400":
                    description: invalid request body
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
                "403":
                    description: forbidden
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
                "404":
                    description: dataset not found
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
                "502":
                    description: upstream error
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
                "503":
                    description: hugging face unavailable
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
            security:
                - Bearer: []
            summary: Queue a benchmark import job from a Hugging Face dataset
            tags:
                - benchmark
    /v1/benchmark/imports/preview:
        get:
            description: |-
                Fetches a Hugging Face dataset's schema, split size when the
                hub reports it, alias-detected text/label columns, and the
                distinct label values from a bounded streaming sample, so a
                caller can pick text/label columns before queuing a full
                import with POST /v1/benchmark/imports.
            operationId: inspectBenchmarkImport
            parameters:
                - description: Hugging Face dataset slug, e.g. owner/name
                  in: query
                  name: slug
                  required: true
                  type: string
                - description: 'Dataset split (default: train)'
                  in: query
                  name: split
                  type: string
                - description: Dataset config name
                  in: query
                  name: config
                  type: string
                - description: Dataset revision (branch, tag, or commit SHA)
                  in: query
                  name: revision
                  type: string
                - description: 'Label column name (default: alias-detected)'
                  in: query
                  name: label_column
                  type: string
                - description: 'Rows to sample for column detection (default: server-chosen)'
                  in: query
                  name: sample_rows
                  type: integer
                - description: 'Numeric score column name (default: alias-detected, only when no label column resolves)'
                  in: query
                  name: score_column
                  type: string
                - description: 'Block threshold for score_column (default: the server''s suggested threshold)'
                  in: query
                  name: score_threshold
                  type: number
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/benchmark.BenchmarkImportPreviewResponse'
                "400":
                    description: invalid request
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
                "403":
                    description: forbidden
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
                "404":
                    description: dataset not found
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
                "502":
                    description: upstream error
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
                "503":
                    description: hugging face unavailable
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
            security:
                - Bearer: []
            summary: Preview a Hugging Face dataset before importing it
            tags:
                - benchmark
    /v1/benchmark/jobs:
        post:
            consumes:
                - application/json
            operationId: submitBenchmarkJob
            parameters:
                - description: Corpus and target configuration
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/benchmark.SubmitJobRequest'
            produces:
                - application/json
            responses:
                "202":
                    description: Accepted
                    schema:
                        $ref: '#/definitions/benchmark.SubmitJobResponse'
                "400":
                    description: invalid request body
                    schema:
                        type: string
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
                "502":
                    description: upstream error
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
            security:
                - Bearer: []
            summary: Submit a benchmark corpus job
            tags:
                - benchmark
    /v1/benchmark/jobs/{id}:
        get:
            operationId: getBenchmarkJob
            parameters:
                - description: Job ID
                  in: path
                  name: id
                  required: true
                  type: string
                - description: Row page offset (default 0)
                  in: query
                  name: offset
                  type: integer
                - description: Max rows to return (default 100)
                  in: query
                  name: limit
                  type: integer
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/benchmark.GetJobResponse'
                "400":
                    description: invalid query parameter
                    schema:
                        type: string
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
                "404":
                    description: not found
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
                "502":
                    description: upstream error
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
            security:
                - Bearer: []
            summary: Poll a benchmark job's status and result
            tags:
                - benchmark
    /v1/benchmark/runs:
        get:
            operationId: listBenchmarkRuns
            parameters:
                - description: Max runs to return (0 or omitted = 100)
                  in: query
                  name: limit
                  type: integer
                - description: Page offset (default 0)
                  in: query
                  name: offset
                  type: integer
                - description: Lower bound on ran_at (Unix seconds, 0 = none)
                  in: query
                  name: since_unix
                  type: integer
                - description: Upper bound on ran_at (Unix seconds, 0 = none)
                  in: query
                  name: until_unix
                  type: integer
                - description: Filter by exact gateway version tag
                  in: query
                  name: gateway_version
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/benchmark.ListRunsResponse'
                "400":
                    description: invalid query parameter
                    schema:
                        type: string
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
                "502":
                    description: upstream error
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
            security:
                - Bearer: []
            summary: List persisted benchmark run history
            tags:
                - benchmark
    /v1/benchmark/runs/{id}/rows:
        get:
            operationId: listBenchmarkRunRows
            parameters:
                - description: Run ID (BenchmarkRun.id)
                  in: path
                  name: id
                  required: true
                  type: string
                - description: Max rows to return (0 or omitted = 100; pact-benchmark accepts 1-5000)
                  in: query
                  name: limit
                  type: integer
                - description: Row page offset (default 0)
                  in: query
                  name: offset
                  type: integer
                - description: Exact-match category filter (omitted = all)
                  in: query
                  name: category
                  type: string
                - description: 'Row class filter: false_negative, false_positive, error, unscored, mitigated (omitted = all)'
                  in: query
                  name: outcome
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/benchmark.ListRunRowsResponse'
                "400":
                    description: invalid query parameter
                    schema:
                        type: string
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
                "404":
                    description: run not found
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
                "502":
                    description: upstream error
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
            security:
                - Bearer: []
            summary: List the persisted rows of one benchmark run
            tags:
                - benchmark
    /v1/benchmark/testlab/runs:
        get:
            operationId: listBenchmarkTestLabRuns
            parameters:
                - description: Page size 1-200 (default 50)
                  in: query
                  name: limit
                  type: integer
                - description: Page offset (default 0)
                  in: query
                  name: offset
                  type: integer
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/benchmark.ListTestLabRunsResponse'
                "400":
                    description: invalid query parameter
                    schema:
                        type: string
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
                "502":
                    description: upstream error
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
            security:
                - Bearer: []
            summary: List Test Lab run history
            tags:
                - benchmark
        post:
            consumes:
                - application/json
            description: |-
                Status defaults to "ok" when omitted. An "ok" run requires a
                non-empty decision; an "error" run may omit decision and
                instead carries a short error summary.
            operationId: saveBenchmarkTestLabRun
            parameters:
                - description: Prompt, decision (or error), and metadata for one Test Lab submission
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/benchmark.SaveTestLabRunRequest'
            produces:
                - application/json
            responses:
                "201":
                    description: Created
                    schema:
                        $ref: '#/definitions/benchmark.SaveTestLabRunResponse'
                "400":
                    description: invalid request body
                    schema:
                        type: string
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
                "502":
                    description: upstream error
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
            security:
                - Bearer: []
            summary: Save one Test Lab run-history entry
            tags:
                - benchmark
schemes:
    - http
    - https
securityDefinitions:
    Bearer:
        description: |-
            pact-auth session token. Accepts either the legacy opaque
            token (single segment, format <random>.<base64-hmac>),
            validated via a ValidateSession RPC, or - when edge session
            verification is enabled - a JWT-shaped token (three
            dot-separated segments), verified locally against
            pact-auth's Ed25519 public key.
        in: header
        name: Authorization
        type: apiKey
swagger: "2.0"
