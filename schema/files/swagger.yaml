basePath: /
definitions:
    boundary.ErrorResponse:
        properties:
            code:
                type: string
            error:
                type: string
        type: object
    files.FileResponse:
        properties:
            contentType:
                type: string
            createdAt:
                type: string
            filename:
                type: string
            id:
                type: string
            purpose:
                type: string
            sizeBytes:
                type: integer
            status:
                type: string
            storageKey:
                type: string
            thumbnailKey:
                type: string
            updatedAt:
                type: string
            userId:
                type: string
        type: object
    files.GetFileResponse:
        properties:
            downloadUrl:
                type: string
            downloadUrlExpiresAt:
                type: string
            file:
                $ref: '#/definitions/files.FileResponse'
        type: object
    files.ListFilesResponse:
        properties:
            files:
                items:
                    $ref: '#/definitions/files.FileResponse'
                type: array
            total:
                type: integer
        type: object
    files.RequestUploadBody:
        properties:
            contentType:
                type: string
            filename:
                type: string
            purpose:
                type: string
            sizeBytes:
                type: integer
        type: object
    files.RequestUploadResponse:
        properties:
            fileId:
                type: string
            uploadUrl:
                type: string
            uploadUrlExpiresAt:
                type: string
        type: object
host: localhost:8110
info:
    contact: {}
    description: Public REST entrypoint for the PACT safety pipeline.
    title: pact-gateway
    version: 0.1.0
paths:
    /v1/files/:
        get:
            parameters:
                - description: Page size 1..200 (default 50)
                  in: query
                  name: limit
                  type: integer
                - description: Page offset >= 0 (default 0)
                  in: query
                  name: offset
                  type: integer
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/files.ListFilesResponse'
                "400":
                    description: negative or non-numeric query param
                    schema:
                        type: string
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
            security:
                - Bearer: []
            summary: List the caller's files, newest first
            tags:
                - files
        post:
            consumes:
                - application/json
            parameters:
                - description: Upload metadata
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/files.RequestUploadBody'
            produces:
                - application/json
            responses:
                "201":
                    description: Created
                    schema:
                        $ref: '#/definitions/files.RequestUploadResponse'
                "400":
                    description: missing filename / contentType / sizeBytes, or body too large
                    schema:
                        type: string
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
                "429":
                    description: per-IP rate limit exceeded
                    schema:
                        type: string
            security:
                - Bearer: []
            summary: Request a presigned upload URL
            tags:
                - files
    /v1/files/{id}:
        delete:
            parameters:
                - description: File ID (UUID)
                  in: path
                  name: id
                  required: true
                  type: string
            responses:
                "204":
                    description: Deleted
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
                "404":
                    description: unknown file id
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
            security:
                - Bearer: []
            summary: Soft-delete a file (idempotent)
            tags:
                - files
        get:
            parameters:
                - description: File ID (UUID)
                  in: path
                  name: id
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/files.GetFileResponse'
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
                "404":
                    description: unknown file id
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
            security:
                - Bearer: []
            summary: Get file metadata and presigned download URL when ready
            tags:
                - files
    /v1/files/{id}/confirm:
        post:
            parameters:
                - description: File ID (UUID)
                  in: path
                  name: id
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    description: Record is now processing
                    schema:
                        $ref: '#/definitions/files.FileResponse'
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
                "404":
                    description: unknown file id
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
            security:
                - Bearer: []
            summary: Confirm a completed upload and start the validation pipeline
            tags:
                - files
schemes:
    - http
    - https
securityDefinitions:
    Bearer:
        description: |-
            pact-auth session token. Accepts either the legacy opaque
            token (single segment, format <random>.<base64-hmac>),
            validated via a ValidateSession RPC, or - when edge session
            verification is enabled - a JWT-shaped token (three
            dot-separated segments), verified locally against
            pact-auth's Ed25519 public key.
        in: header
        name: Authorization
        type: apiKey
swagger: "2.0"
