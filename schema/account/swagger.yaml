basePath: /
definitions:
    account.ConsentResponse:
        properties:
            document:
                type: string
            granted:
                type: boolean
            recordedAt:
                type: string
            version:
                type: string
        type: object
    account.ConsentsResponse:
        properties:
            consents:
                items:
                    $ref: '#/definitions/account.ConsentResponse'
                type: array
        type: object
    account.ErasureResponse:
        properties:
            requestedAt:
                type: string
        type: object
    account.PreferencesResponse:
        properties:
            marketingEmail:
                type: boolean
            productEmail:
                type: boolean
            updatedAt:
                type: string
            userId:
                type: string
        type: object
    account.ProfileResponse:
        properties:
            avatarUrl:
                type: string
            bio:
                type: string
            createdAt:
                type: string
            displayName:
                type: string
            locale:
                type: string
            timezone:
                type: string
            updatedAt:
                type: string
            userId:
                type: string
        type: object
    account.RecordConsentRequest:
        properties:
            document:
                type: string
            granted:
                type: boolean
            version:
                type: string
        type: object
    account.UpdatePreferencesRequest:
        properties:
            marketingEmail:
                type: boolean
            productEmail:
                type: boolean
            updateMask:
                items:
                    type: string
                type: array
        type: object
    account.UpdateProfileRequest:
        properties:
            avatarUrl:
                type: string
            bio:
                type: string
            displayName:
                type: string
            locale:
                type: string
            timezone:
                type: string
            updateMask:
                items:
                    type: string
                type: array
        type: object
    boundary.ErrorResponse:
        properties:
            code:
                type: string
            error:
                type: string
        type: object
host: localhost:8110
info:
    contact: {}
    description: Public REST entrypoint for the PACT safety pipeline.
    title: pact-gateway
    version: 0.1.0
paths:
    /v1/account/consents:
        get:
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/account.ConsentsResponse'
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
            security:
                - Bearer: []
            summary: List the latest consent decision per document
            tags:
                - account
        post:
            consumes:
                - application/json
            parameters:
                - description: Consent record (IP and User-Agent are taken from the request, not the body)
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/account.RecordConsentRequest'
            produces:
                - application/json
            responses:
                "201":
                    description: Created
                    schema:
                        $ref: '#/definitions/account.ConsentResponse'
                "400":
                    description: missing document or version
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
            security:
                - Bearer: []
            summary: Record a consent decision (Art. 7 evidence)
            tags:
                - account
    /v1/account/erasure:
        post:
            produces:
                - application/json
            responses:
                "202":
                    description: Accepted - pact-account row deleted; downstream cascade is async
                    schema:
                        $ref: '#/definitions/account.ErasureResponse'
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
            security:
                - Bearer: []
            summary: Request erasure of the signed-in user's data (GDPR Art. 17)
            tags:
                - account
    /v1/account/export:
        get:
            produces:
                - application/json
            responses:
                "200":
                    description: Free-form JSON payload of pact-account-owned data
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
            security:
                - Bearer: []
            summary: Export pact-account-owned data (GDPR Art. 15)
            tags:
                - account
    /v1/account/preferences:
        get:
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/account.PreferencesResponse'
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
            security:
                - Bearer: []
            summary: Get notification preferences
            tags:
                - account
        put:
            consumes:
                - application/json
            parameters:
                - description: Fields to update plus updateMask
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/account.UpdatePreferencesRequest'
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/account.PreferencesResponse'
                "400":
                    description: invalid body or unknown updateMask entry
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
            security:
                - Bearer: []
            summary: Patch notification preferences (mask semantics)
            tags:
                - account
    /v1/account/profile:
        get:
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/account.ProfileResponse'
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
            security:
                - Bearer: []
            summary: Get the signed-in user's profile
            tags:
                - account
        put:
            consumes:
                - application/json
            parameters:
                - description: Fields to update plus updateMask
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/account.UpdateProfileRequest'
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/account.ProfileResponse'
                "400":
                    description: invalid body or unknown updateMask entry
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
            security:
                - Bearer: []
            summary: Patch the signed-in user's profile (mask semantics)
            tags:
                - account
schemes:
    - http
    - https
securityDefinitions:
    Bearer:
        description: |-
            pact-auth session token. Accepts either the legacy opaque
            token (single segment, format <random>.<base64-hmac>),
            validated via a ValidateSession RPC, or - when edge session
            verification is enabled - a JWT-shaped token (three
            dot-separated segments), verified locally against
            pact-auth's Ed25519 public key.
        in: header
        name: Authorization
        type: apiKey
swagger: "2.0"
