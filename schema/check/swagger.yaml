basePath: /
definitions:
    boundary.ErrorResponse:
        properties:
            code:
                type: string
            error:
                type: string
        type: object
    boundary.InputTooLargeResponse:
        properties:
            code:
                type: string
            error:
                type: string
            max_input_bytes:
                type: integer
        type: object
    check.CausalSpanInfo:
        properties:
            end:
                type: integer
            start:
                type: integer
        type: object
    check.CheckRequest:
        properties:
            content:
                description: |-
                    Content is the text to check. Required unless file_id is set; the two
                    are mutually exclusive.
                type: string
            conversation_id:
                description: |-
                    ConversationID is an optional client-supplied chat/thread correlation id.
                    Mirrored verbatim onto the pact.decisions audit event so a decision can
                    be traced back to the chat session that produced it. May also be supplied
                    via the X-Pact-Conversation-Id header; the body value wins when both are
                    present. Opaque to the gateway - never parsed or validated.
                type: string
            evidence:
                description: |-
                    Evidence opts this call into evidence mode: the response gains an
                    evidence object reporting, per defense layer, whether that layer alone
                    would have blocked the input and how long it took. The returned decision
                    is the real posture's decision, unchanged. Restricted to authorized
                    callers: anyone else gets 403 with code evidence_forbidden. Optional;
                    absent or false leaves the response byte-identical to a normal call.
                type: boolean
            external_refs:
                description: |-
                    ExternalRefs is an optional list of third-party references (URLs) the
                    gateway fetches in an isolated worker and re-scans for indirect prompt
                    injection. When present and the sandbox is enabled, the request
                    blocks if any reference is hostile - before the caller passes the fetched
                    content to its LLM. Unlike SpotlightChunks, the content is NOT supplied
                    inline; the gateway fetches it.
                items:
                    $ref: '#/definitions/check.ExternalRef'
                type: array
            file_id:
                description: |-
                    FileID names an uploaded file (a UUID) whose already scanned text this
                    request is about, in place of content. The gateway does not scan the file
                    text again: it gates on the verdict pact-files recorded when the file
                    was scanned, and the response says which text that verdict covers
                    (file.content_sha256). Because the file text is never scanned together
                    with other text, an instruction split across a prompt and a file is not
                    judged as a whole; each is judged on its own. Requires kind=input and
                    the caller must own the file. Cannot be combined with content,
                    external_refs, evidence, tool_id, scope or an X-Pact-Capability-Token:
                    those answer 400 with code invalid_file_ref. An unknown file and
                    another user's file are indistinguishable (404 file_not_found).
                type: string
            kind:
                description: '"input" | "output"'
                type: string
            scope:
                description: |-
                    Scope is the scope the caller declares for this request. Optional,
                    opaque, at most 256 bytes. Only meaningful with an
                    X-Pact-Capability-Token: when present it must be one of the token's
                    scopes (exact, case-sensitive), otherwise the request is blocked with
                    policy_token_scope_denied. Ignored without a token.
                type: string
            spotlight_chunks:
                description: |-
                    SpotlightChunks is an optional list of third-party content chunks the host
                    wants spotlight-wrapped before LLM injection. Populated on allow path only.
                items:
                    $ref: '#/definitions/check.SpotlightChunk'
                type: array
            tool_id:
                description: |-
                    ToolID is the tool the caller declares this request is for. Optional,
                    opaque, at most 256 bytes. Only meaningful with an
                    X-Pact-Capability-Token: when present it must equal the token's tool_id,
                    otherwise the request is blocked with policy_token_scope_denied.
                    Ignored without a token.
                type: string
            traffic_source:
                description: |-
                    TrafficSource is the caller's own declaration of synthetic vs real
                    traffic (e.g. "benchmark"), mirrored verbatim onto the pact.decisions
                    audit event. Attribution only - it carries no access-control
                    weight and is never used to grant or deny a request. Optional; when
                    present it must match ^[a-z0-9_-]{1,32}$, the same pattern the
                    decisions schema enforces on the audit event.
                type: string
        required:
            - kind
        type: object
    check.CheckResponse:
        properties:
            classifier:
                $ref: '#/definitions/check.ClassifierInfo'
            consensus:
                $ref: '#/definitions/check.ConsensusInfo'
            decision:
                enum:
                    - allow
                    - block
                type: string
            diagnostics:
                $ref: '#/definitions/check.DiagnosticsInfo'
            evidence:
                allOf:
                    - $ref: '#/definitions/check.EvidenceInfo'
                description: Evidence is present only on an evidence-mode request.
            external_refs:
                $ref: '#/definitions/check.ExternalRefsInfo'
            file:
                allOf:
                    - $ref: '#/definitions/check.FileInfo'
                description: |-
                    File is present only on a request that carried file_id and reached a
                    verdict.
            filter:
                $ref: '#/definitions/check.FilterInfo'
            filter_rule_id:
                type: string
            latency_ms:
                type: integer
            policy:
                $ref: '#/definitions/check.PolicyInfo'
            reason:
                type: string
            redactor:
                $ref: '#/definitions/check.RedactorInfo'
            request_id:
                type: string
            spotlight:
                $ref: '#/definitions/check.SpotlightInfo'
            stages:
                description: |-
                    Stages is the executed-stage list of the decision, in execution order:
                    the same value the pact.decisions event stores (pipeline.Decision.Stages).
                    Omitted when no stage ran.
                items:
                    type: string
                type: array
        required:
            - decision
            - latency_ms
            - request_id
        type: object
    check.ClassifierInfo:
        properties:
            duration_ms:
                description: |-
                    DurationMs is the classifier stage's wall-clock RPC time in fractional
                    milliseconds, for the primary Classify call only; absent
                    when the classifier stage did not run.
                type: number
            engine:
                description: |-
                    Engine is the exercised classifier model version as echoed by
                    pact-classifier; absent when the classifier stage did not run or did
                    not report one.
                type: string
            label:
                type: string
            score:
                type: number
        type: object
    check.ConsensusInfo:
        properties:
            confidence:
                description: |-
                    Confidence is the consensus stage's aggregated confidence score,
                    mirroring decisions.ConsensusDecision.Confidence. 0 on the
                    transport fail-open path.
                type: number
            duration_ms:
                description: |-
                    DurationMs is the consensus stage's wall-clock RPC time in fractional
                    milliseconds, the fleet duration convention; present whenever this sub-object
                    is. nil is never emitted as 0.
                type: number
            label:
                description: |-
                    Label is the consensus stage's aggregated outcome, mirroring
                    decisions.ConsensusDecision.Label - the pact.decisions Kafka event's
                    consensus sub-object - byte-for-byte in field name and value set.
                    Empty on the transport fail-open path (the sub-object is
                    still present for DurationMs, but the vote never produced a verdict).
                enum:
                    - unspecified
                    - benign
                    - prompt_injection
                    - jailbreak
                    - sensitive
                    - unknown
                type: string
        type: object
    check.DiagnosticsInfo:
        properties:
            causal_spans:
                items:
                    $ref: '#/definitions/check.CausalSpanInfo'
                type: array
        type: object
    check.EvidenceInfo:
        properties:
            classifier:
                $ref: '#/definitions/check.EvidenceLayerInfo'
            classifier_consensus:
                $ref: '#/definitions/check.EvidenceLayerInfo'
            filter_rules:
                $ref: '#/definitions/check.EvidenceLayerInfo'
            filter_rules_similarity:
                $ref: '#/definitions/check.EvidenceLayerInfo'
            other_stages:
                $ref: '#/definitions/check.EvidenceLayerInfo'
        type: object
    check.EvidenceLayerInfo:
        properties:
            duration_ms:
                description: |-
                    DurationMs is the wall-clock time of the call(s) behind the verdict in
                    fractional milliseconds; present only when evaluated is true.
                type: number
            evaluated:
                description: Evaluated is false when the layer produced no verdict.
                type: boolean
            reason:
                description: |-
                    Reason explains an unevaluated layer, or annotates an evaluated one
                    (input_too_large: content over the classifier's ceiling, which blocks).
                enum:
                    - filter_unavailable
                    - tier_not_reported
                    - classifier_unavailable
                    - classifier_saturated
                    - input_too_large
                    - classifier_mitigation_failed
                    - consensus_not_configured
                    - consensus_unavailable
                    - stage_error
                    - deadline_exceeded
                type: string
            would_block:
                description: |-
                    WouldBlock is whether this layer alone would have blocked the input.
                    Meaningful only when evaluated is true.
                type: boolean
        type: object
    check.ExternalRef:
        properties:
            source:
                type: string
            url:
                type: string
        type: object
    check.ExternalRefInfo:
        properties:
            host:
                type: string
            purified_content:
                type: string
            source:
                type: string
            verdict:
                enum:
                    - clean
                    - hostile
                    - unfetchable
                    - skipped
                    - blocked
                    - mitigated
                type: string
        type: object
    check.ExternalRefsInfo:
        properties:
            blocked:
                type: integer
            duration_ms:
                description: |-
                    DurationMs is the wall-clock time of the whole sandbox scan in
                    fractional milliseconds; present whenever this sub-object is. nil is
                    never emitted as 0.
                type: number
            mitigated:
                type: integer
            refs:
                items:
                    $ref: '#/definitions/check.ExternalRefInfo'
                type: array
            scanned:
                type: integer
        type: object
    check.FileInfo:
        properties:
            content_sha256:
                description: |-
                    ContentSHA256 is the sha256 hex of the scanned text the verdict covers.
                    Absent when the file was blocked or refused before a text was named.
                type: string
            file_id:
                type: string
            scan_reason:
                type: string
            scan_stage:
                description: |-
                    ScanStage and ScanReason echo the pipeline stage and reason that blocked
                    the file. Present only when reason is file_scan_blocked.
                type: string
        type: object
    check.FilterInfo:
        properties:
            duration_ms:
                description: |-
                    DurationMs is the filter stage's wall-clock RPC time in fractional
                    milliseconds; present whenever this sub-object is, since the
                    filter stage always ran to produce a verdict. nil is never emitted as 0.
                type: number
            rule_id:
                type: string
            shadow:
                description: true when the match was a dry-run / shadow rule
                type: boolean
            verdict:
                enum:
                    - safe
                    - suspicious
                    - hostile
                    - unknown
                type: string
        type: object
    check.PolicyInfo:
        properties:
            duration_ms:
                description: |-
                    DurationMs is the policy stage's wall-clock RPC time in fractional
                    milliseconds (the token validation plus the tool-policy lookup when one
                    is made); present whenever this sub-object is. nil is never emitted as 0.
                type: number
            verdict:
                enum:
                    - allowed
                    - denied
                    - unknown
                type: string
        type: object
    check.RedactedSpan:
        properties:
            end:
                type: integer
            label:
                type: string
            start:
                type: integer
        required:
            - end
            - start
        type: object
    check.RedactorInfo:
        properties:
            duration_ms:
                description: |-
                    DurationMs is the redactor stage's wall-clock RPC time in fractional
                    milliseconds; present whenever this sub-object is, including
                    the transport fail-open path (verdict "unknown").
                type: number
            spans:
                items:
                    $ref: '#/definitions/check.RedactedSpan'
                type: array
            verdict:
                enum:
                    - pass_through
                    - redacted
                    - unknown
                type: string
        type: object
    check.SpotlightChunk:
        properties:
            content:
                type: string
            source:
                description: e.g. "rag:doc#42", "tool:search", "url:https://…"
                type: string
            trust:
                enum:
                    - trusted
                    - user
                    - untrusted
                type: string
        type: object
    check.SpotlightInfo:
        properties:
            chunks:
                items:
                    $ref: '#/definitions/check.WrappedChunk'
                type: array
            format:
                enum:
                    - delim
                    - xml
                    - json
                type: string
            header:
                description: system-prompt fragment; only when SPOTLIGHT_INJECT_HEADER=true
                type: string
            source_count:
                type: integer
        type: object
    check.WrappedChunk:
        properties:
            source:
                type: string
            trust:
                enum:
                    - trusted
                    - user
                    - untrusted
                type: string
            wrapped:
                description: nonce-tagged marker envelope ready for LLM injection
                type: string
        type: object
host: localhost:8110
info:
    contact: {}
    description: Public REST entrypoint for the PACT safety pipeline.
    title: pact-gateway
    version: 0.1.0
paths:
    /v1/check:
        post:
            consumes:
                - application/json
            description: |-
                File references: instead of content, body field file_id (a UUID, with kind=input) checks an uploaded file by the verdict pact-files recorded when it scanned the file. The file text is not scanned again, and it is never scanned together with other text: an instruction split across a prompt and a file is not judged as a whole. A file_id request returns decision allow with stages [file_scan] and a file object naming the scanned text (file_id, content_sha256), or decision block with reason file_scan_blocked and the file's scan_stage and scan_reason; every other state is an error response with a stable code. file_id cannot be combined with content, external_refs, evidence, tool_id, scope or a capability token (400 invalid_file_ref).
                Evidence mode (body field evidence=true, authorized callers only) adds an evidence object to the response: per defense layer, whether that layer alone would have blocked the input. The decision is unchanged. Two limits apply to the scanned text. The hard byte ceiling is 40,573 bytes of UTF-8 text by default (setting MAX_INPUT_BYTES): larger content never reaches a stage and is answered with HTTP 413, code input_too_large and max_input_bytes, and is audited as a block. Below it, the classifier scores at most 6,242 tokens, which is the binding limit for typical text: English prose is fully scored up to about 26 KB (roughly 4,600 words), and code or non-English text up to fewer bytes. Content over the token budget but under the byte ceiling cannot be fully scanned and is answered with HTTP 200 and decision block, reason classifier_input_too_large, not a 400.
            operationId: checkContent
            parameters:
                - description: Content (or file_id) and kind (input|output); optional conversation_id, traffic_source, tool_id, scope
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/check.CheckRequest'
                - description: Client chat/thread correlation id for the audit trail (body conversation_id wins when both supplied)
                  in: header
                  name: X-Pact-Conversation-Id
                  type: string
                - description: Capability token; when present, body tool_id and scope (if declared) must be covered by it, else the request is blocked with policy_token_scope_denied
                  in: header
                  name: X-Pact-Capability-Token
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/check.CheckResponse'
                "400":
                    description: malformed request; a malformed file_id request is a boundary.ErrorResponse with code invalid_file_ref
                    schema:
                        type: string
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
                "403":
                    description: 'evidence mode requested by a caller that is not authorized for it: code evidence_forbidden'
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
                "404":
                    description: 'file_id request: the file does not exist or is not the caller''s (the two are indistinguishable): code file_not_found'
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
                "409":
                    description: 'file_id request: the file is not usable yet or its stored text cannot be trusted: code file_not_ready, file_scan_pending (with Retry-After), file_text_unavailable or file_hash_mismatch'
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
                "413":
                    description: 'scanned content exceeds the input ceiling: code input_too_large, max_input_bytes carries the ceiling in bytes; a file_id request over the size limit answers code file_too_large with a boundary.ErrorResponse body'
                    schema:
                        $ref: '#/definitions/boundary.InputTooLargeResponse'
                "422":
                    description: 'file_id request: the file was rejected at upload or its scan failed or was skipped: code file_rejected, file_scan_failed or file_scan_skipped'
                    schema:
                        $ref: '#/definitions/boundary.ErrorResponse'
                "429":
                    description: 'per-IP rate limit exceeded, benchmark replay traffic throttled, or the safety classifier is saturated: retryable, with Retry-After and code classifier_saturated'
                    schema:
                        type: string
                "503":
                    description: auth dependency unavailable, or for a file_id request the file service is unavailable (code file_unavailable, with Retry-After)
                    schema:
                        type: string
                "504":
                    description: request exceeded timeout
                    schema:
                        type: string
            security:
                - Bearer: []
            summary: Evaluate content against the safety pipeline
            tags:
                - check
schemes:
    - http
    - https
securityDefinitions:
    Bearer:
        description: |-
            pact-auth session token. Accepts either the legacy opaque
            token (single segment, format <random>.<base64-hmac>),
            validated via a ValidateSession RPC, or - when edge session
            verification is enabled - a JWT-shaped token (three
            dot-separated segments), verified locally against
            pact-auth's Ed25519 public key.
        in: header
        name: Authorization
        type: apiKey
swagger: "2.0"
