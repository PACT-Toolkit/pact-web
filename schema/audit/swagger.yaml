basePath: /
definitions:
    audit.AnnotateDecisionRequest:
        properties:
            kind:
                enum:
                    - false_positive
                type: string
            requestId:
                type: string
        type: object
    audit.AnnotateDecisionResponse:
        properties:
            annotation:
                $ref: '#/definitions/audit.AnnotatedDecision'
            created:
                type: boolean
        type: object
    audit.AnnotatedDecision:
        properties:
            actor:
                type: string
            kind:
                type: string
            requestId:
                type: string
        type: object
    audit.AuditEventResponse:
        properties:
            createdAt:
                type: string
            eventId:
                type: string
            id:
                type: string
            payloadJson:
                type: string
            requestId:
                type: string
            topic:
                type: string
            userId:
                type: string
        type: object
    audit.DecisionAnnotationResponse:
        properties:
            actor:
                type: string
            createdAt:
                type: string
            kind:
                type: string
            requestId:
                type: string
        type: object
    audit.DecisionStatsClassifier:
        properties:
            avg_tagged_score:
                type: number
            consensus:
                type: integer
            labels:
                items:
                    $ref: '#/definitions/audit.DecisionStatsLabelCount'
                type: array
            responded:
                type: integer
            tagged:
                type: integer
            top_label:
                type: string
        type: object
    audit.DecisionStatsFilter:
        properties:
            block_rate:
                type: number
            blocked:
                type: integer
            flagged:
                type: integer
            hostile:
                type: integer
            suspicious:
                type: integer
            top_rule_id:
                type: string
            top_rules:
                items:
                    $ref: '#/definitions/audit.DecisionStatsLabelCount'
                type: array
        type: object
    audit.DecisionStatsLabelCount:
        properties:
            count:
                type: integer
            label:
                type: string
        type: object
    audit.DecisionStatsRedactor:
        properties:
            redacted:
                type: integer
            redaction_rate:
                type: number
            span_labels:
                items:
                    $ref: '#/definitions/audit.DecisionStatsLabelCount'
                type: array
            spans:
                type: integer
        type: object
    audit.ListDecisionAnnotationsRequest:
        properties:
            requestIds:
                items:
                    type: string
                type: array
        type: object
    audit.ListDecisionAnnotationsResponse:
        properties:
            annotations:
                items:
                    $ref: '#/definitions/audit.DecisionAnnotationResponse'
                type: array
        type: object
    audit.PolicyEventResponse:
        properties:
            createdAt:
                type: string
            decision:
                type: string
            id:
                type: string
            policy:
                $ref: '#/definitions/audit.PolicyInfo'
            reason:
                type: string
            requestId:
                type: string
        type: object
    audit.PolicyInfo:
        properties:
            agentId:
                type: string
            toolId:
                type: string
            verdict:
                type: string
        type: object
    audit.QueryAuditResponse:
        properties:
            events:
                items:
                    $ref: '#/definitions/audit.AuditEventResponse'
                type: array
            total:
                type: integer
        type: object
    audit.QueryDecisionStatsResponse:
        properties:
            classifier:
                $ref: '#/definitions/audit.DecisionStatsClassifier'
            filter:
                $ref: '#/definitions/audit.DecisionStatsFilter'
            latest_at_unix:
                type: integer
            redactor:
                $ref: '#/definitions/audit.DecisionStatsRedactor'
            total:
                type: integer
        type: object
    audit.QueryPolicyEventsResponse:
        properties:
            events:
                items:
                    $ref: '#/definitions/audit.PolicyEventResponse'
                type: array
            total:
                type: integer
        type: object
    audit.RemoveDecisionAnnotationResponse:
        properties:
            removed:
                type: boolean
        type: object
host: localhost:8110
info:
    contact: {}
    description: Public REST entrypoint for the PACT safety pipeline.
    title: pact-gateway
    version: 0.1.0
paths:
    /v1/audit/annotations:
        delete:
            operationId: removeDecisionAnnotation
            parameters:
                - description: Request id the annotation was recorded against
                  in: query
                  name: requestId
                  required: true
                  type: string
                - description: Annotation kind
                  enum:
                    - false_positive
                  in: query
                  name: kind
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/audit.RemoveDecisionAnnotationResponse'
                "400":
                    description: missing requestId or unknown kind
                    schema:
                        type: string
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
            security:
                - Bearer: []
            summary: Remove an operator annotation on a decision
            tags:
                - audit
        post:
            consumes:
                - application/json
            operationId: annotateDecision
            parameters:
                - description: Request id and annotation kind
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/audit.AnnotateDecisionRequest'
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/audit.AnnotateDecisionResponse'
                "400":
                    description: missing requestId, unknown kind, or invalid body
                    schema:
                        type: string
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
            security:
                - Bearer: []
            summary: Record an operator annotation on a decision
            tags:
                - audit
    /v1/audit/annotations/query:
        post:
            consumes:
                - application/json
            operationId: listDecisionAnnotations
            parameters:
                - description: 1-200 request ids to look up
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/audit.ListDecisionAnnotationsRequest'
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/audit.ListDecisionAnnotationsResponse'
                "400":
                    description: requestIds empty, over 200 entries, or invalid body
                    schema:
                        type: string
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
            security:
                - Bearer: []
            summary: Batch-read operator annotations for a set of decisions
            tags:
                - audit
    /v1/audit/events:
        get:
            parameters:
                - description: Exact match on topic (e.g. pact.auth, pact.files)
                  in: query
                  name: topic
                  type: string
                - description: Exact match on gateway request-id
                  in: query
                  name: requestId
                  type: string
                - description: Inclusive lower bound on createdAt (unix seconds UTC)
                  in: query
                  name: sinceUnix
                  type: integer
                - description: Exclusive upper bound on createdAt (unix seconds UTC)
                  in: query
                  name: untilUnix
                  type: integer
                - description: Page size 1..200 (default 50)
                  in: query
                  name: limit
                  type: integer
                - description: Page offset >= 0 (default 0)
                  in: query
                  name: offset
                  type: integer
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/audit.QueryAuditResponse'
                "400":
                    description: invalid query parameter
                    schema:
                        type: string
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
            security:
                - Bearer: []
            summary: Read the caller's audit log
            tags:
                - audit
    /v1/audit/policy-events:
        get:
            parameters:
                - description: Inclusive lower bound on createdAt (unix seconds UTC)
                  in: query
                  name: sinceUnix
                  type: integer
                - description: Page size 1..200 (default 50)
                  in: query
                  name: limit
                  type: integer
                - description: Page offset >= 0 (default 0)
                  in: query
                  name: offset
                  type: integer
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/audit.QueryPolicyEventsResponse'
                "400":
                    description: invalid query parameter
                    schema:
                        type: string
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
            security:
                - Bearer: []
            summary: Read the caller's policy decisions
            tags:
                - audit
    /v1/audit/stats:
        get:
            parameters:
                - description: Inclusive lower bound on createdAt (unix seconds UTC)
                  in: query
                  name: sinceUnix
                  type: integer
                - description: Exclusive upper bound on createdAt (unix seconds UTC)
                  in: query
                  name: untilUnix
                  type: integer
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/audit.QueryDecisionStatsResponse'
                "400":
                    description: invalid query parameter
                    schema:
                        type: string
                "401":
                    description: missing or invalid bearer token
                    schema:
                        type: string
                "403":
                    description: missing required permission
                    schema:
                        type: string
            security:
                - Bearer: []
            summary: Read aggregate decision stats for the pipeline dashboard
            tags:
                - audit
schemes:
    - http
    - https
securityDefinitions:
    Bearer:
        description: |-
            pact-auth session token. Accepts either the legacy opaque
            token (single segment, format <random>.<base64-hmac>),
            validated via a ValidateSession RPC, or - when edge session
            verification is enabled - a JWT-shaped token (three
            dot-separated segments), verified locally against
            pact-auth's Ed25519 public key.
        in: header
        name: Authorization
        type: apiKey
swagger: "2.0"
